<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access Gate</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .gate-card { background: #1e293b; padding: 40px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer; }
    .error { color: #ef4444; font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="gate-card">
    <i class="fas fa-lock" style="font-size: 2.5rem; color: #38bdf8; margin-bottom: 15px;"></i>
    <h2>SECURITY ACCESS GATE</h2>
    <p style="color:#94a3b8; font-size:0.9rem;">Enter password to continue</p>
    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="checkPassword()">Access Portal</button>
    <div class="error" id="errorMsg"></div>
  </div>
  <script>
    const correctPassword = "kbj@2008";
    document.addEventListener("DOMContentLoaded", () => {
      const pwdInput = document.getElementById("passwordInput");
      if (pwdInput) {
        pwdInput.addEventListener("keyup", function(event) {
          if (event.key === "Enter") checkPassword();
        });
      }
    });
    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const errorMsg = document.getElementById("errorMsg");
      if (input === correctPassword) {
        sessionStorage.setItem("access_granted", "yes");
        window.location.href = "index.html";
      } else {
        errorMsg.textContent = "Incorrect password. Please try again.";
        document.getElementById("passwordInput").value = "";
      }
    }
  </script>
</body>
</html>
